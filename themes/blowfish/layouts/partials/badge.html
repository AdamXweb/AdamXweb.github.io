<span class="flex cursor-pointer badge">
  {{if eq . "Micro"}}
  <span
    class="rounded-md border fancy-border px-1 py-[1px] text-xs font-normal text-primary-700 dark:border-primary-600 dark:text-primary-400">
    {{ . }}
  </span>
  {{else}}

  <span
    class="rounded-md border border-primary-400 px-1 py-[1px] text-xs font-normal text-primary-700 dark:border-primary-600 dark:text-primary-400">
    {{ . }}
  </span>
  {{end}}
</span>
